<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Deep emerald background -->
  <rect width="64" height="64" rx="12" fill="#0A2E1A"/>

  <!-- Subtle inner glow ring -->
  <rect width="64" height="64" rx="12" fill="none" stroke="#C8963E" stroke-width="1.5" opacity="0.35"/>

  <!-- 8-pointed Islamic star (two overlapping squares, rotated 45°) -->
  <!-- Square 1 -->
  <polygon
    points="32,10 38,26 54,32 38,38 32,54 26,38 10,32 26,26"
    fill="#C8963E"
    opacity="0.95"
  />
  <!-- Square 2 (rotated 45°) -->
  <polygon
    points="32,14 41.9,22.1 50,32 41.9,41.9 32,50 22.1,41.9 14,32 22.1,22.1"
    fill="#E8C87A"
    opacity="0.6"
  />

  <!-- Center circle -->
  <circle cx="32" cy="32" r="6" fill="#0A2E1A"/>
  <circle cx="32" cy="32" r="4" fill="#C8963E" opacity="0.9"/>
  <circle cx="32" cy="32" r="2" fill="#E8C87A"/>
</svg>

